name: Deploy to Pages

on:
  push:
    branches: [main]
    paths:
      - gravity-gardener/**
      - .github/workflows/deploy.yml

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: cd gravity-gardener && npm ci
      - name: Build
        run: cd gravity-gardener && npm run build
      - name: Deploy to Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gravity-gardener/dist
