name: Deploy to Pages

on:
  push:
    branches: [main]
    paths:
      - gravity-gardener/**
      - paper-storm/**
      - site/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build gravity-gardener
        run: |
          cd gravity-gardener
          npm ci
          npm run build

      - name: Build paper-storm
        run: |
          cd paper-storm
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/gravity-gardener _site/paper-storm
          cp -r gravity-gardener/dist/. _site/gravity-gardener/
          cp -r paper-storm/dist/. _site/paper-storm/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
